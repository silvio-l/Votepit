# Votepit — Apache vhost for the Docker image.
#
# Docroot is public/ (same as the shared-hosting deployment target, see
# documentation/installation.md#4-point-the-web-root-at-public) and
# AllowOverride is enabled so the repo's own public/.htaccess (rewrite to
# index.php, security headers, caching) applies unchanged — no rewrite/
# header logic is duplicated here.
#
# ServerTokens/TraceEnable (OWASP/BSI audit remediation issue 07) are set
# HERE rather than in public/.htaccess: both directives are only valid in
# server-config/virtual-host context — Apache rejects an .htaccess
# containing either one outright (500 on every request), so they can never
# live in the tracked, shared-hosting-portable public/.htaccess. ServerTokens
# is server-config-only (not even overridable per-vhost), hence it sits
# above the <VirtualHost> block, applied once for the whole server process.
ServerTokens Prod

<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    TraceEnable off

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

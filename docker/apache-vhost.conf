# Votepit — Apache vhost for the Docker image.
#
# Docroot is public/ (same as the shared-hosting deployment target, see
# documentation/installation.md#4-point-the-web-root-at-public) and
# AllowOverride is enabled so the repo's own public/.htaccess (rewrite to
# index.php, security headers, caching) applies unchanged — no rewrite/
# header logic is duplicated here.
<VirtualHost *:80>
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes +FollowSymLinks
        AllowOverride All
        Require all granted
    </Directory>

    ErrorLog ${APACHE_LOG_DIR}/error.log
    CustomLog ${APACHE_LOG_DIR}/access.log combined
</VirtualHost>

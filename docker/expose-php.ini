; Votepit — Docker image php.ini addition (OWASP/BSI audit remediation
; issue 07). Copied to /usr/local/etc/php/conf.d/zz-votepit-expose-php.ini
; by the Dockerfile — the "zz-" prefix makes it load last (php.d files load
; alphabetically), so it wins over any earlier expose_php=On the base image
; might ship. Prevents the X-Powered-By: PHP/<version> response header,
; which otherwise leaks the exact PHP version to every client.
expose_php = Off

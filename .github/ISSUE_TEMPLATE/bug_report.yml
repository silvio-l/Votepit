name: Bug report
description: Something in Votepit isn't working as expected.
labels: [bug]
body:
  - type: textarea
    id: description
    attributes:
      label: What happened?
      description: What did you expect instead?
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Votepit version
      description: Release tag or commit hash
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Environment
      description: PHP version, MySQL/MariaDB version, browser (if relevant)
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: Relevant logs or error messages
      render: shell
    validations:
      required: false
